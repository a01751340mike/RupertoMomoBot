# Mesa Financiera en la nube: funciona con tu computadora apagada.
#  · Cada 8 minutos revisa si escribiste /analiza TICKER en Telegram y responde.
#    (cambio de la entrega: antes era cada 10 minutos)
#  · También puedes lanzarlo a mano (incluso desde la app de GitHub en tu celular):
#    Actions → mesa-financiera → Run workflow → escribe el ticker.
name: mesa-financiera

on:
  schedule:
    # Minutos 0, 8, 16, 24, 32, 40, 48 y 56 de cada hora (UTC). El mínimo de GitHub es 5 minutos
    # y en horas de mucha demanda puede retrasar unos minutos las ejecuciones programadas.
    - cron: "*/8 * * * *"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a analizar (déjalo vacío para solo revisar Telegram)"
        required: false
        default: "AAPL"
      simulacion:
        description: "Modo simulación (sin gastar llaves)"
        type: boolean
        default: false

concurrency:                        # evita dos ejecuciones al mismo tiempo
  group: mesa-financiera
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 7              # menor que el cron, para no encimar ejecuciones
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MODO_SIMULACION: ${{ inputs.simulacion && '1' || '0' }}
      TICKER: ${{ inputs.ticker }}  # se pasa como variable, nunca se pega dentro del comando
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 · SEGURIDAD: versión fija
        with:
          persist-credentials: false   # SEGURIDAD: no deja el token de GitHub guardado en el runner
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Analizar el ticker indicado a mano
        if: github.event_name == 'workflow_dispatch' && env.TICKER != ''
        run: python analizar.py "$TICKER" --telegram

      - name: Revisar mensajes pendientes en Telegram
        run: python revisar_telegram.py

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: evidencias-${{ github.run_number }}
          path: salidas/
          if-no-files-found: ignore
          retention-days: 7   # SEGURIDAD: las evidencias no se guardan más de lo necesario
