# SEGURIDAD: Dependabot revisa cada semana si hay versiones nuevas (o con fallas de seguridad)
# de las librerías de Python y de las acciones de GitHub, y propone la actualización con un Pull Request.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
